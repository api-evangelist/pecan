aid: pecan
name: Pecan
description: Pecan AI is a predictive analytics platform that lets business teams generate machine-learning
  predictions without data-science expertise. Users describe a business question in natural language and
  Pecan builds, trains, and deploys predictive models for outcomes such as customer churn, lifetime value
  (LTV), lead scoring, demand forecasting, upsell and cross-sell, campaign ROAS, and fraud prevention.
  Predictions connect back to CRMs, marketing platforms, and BI dashboards through native integrations
  or an API. The company markets itself as a predictive AI agent built for business outcomes rather than
  raw models, and runs on AWS with ISO 27001 and SOC 2 Type II security certifications.
